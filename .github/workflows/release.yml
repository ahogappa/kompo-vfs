name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: macos-latest
            os: darwin
            arch: arm64
          - runner: ubuntu-latest
            os: linux
            arch: x86_64

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build release
        run: cargo build --release

      - name: Extract version from Cargo.toml
        id: version
        run: |
          VERSION=$(sed -n '/\[workspace\.package\]/,/^\[/{ s/^version = "\(.*\)"/\1/p; }' Cargo.toml)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create tarball
        run: |
          ARCHIVE_NAME="kompo-vfs-${{ github.ref_name }}-${{ matrix.os }}-${{ matrix.arch }}"
          mkdir -p "${ARCHIVE_NAME}/lib"
          cp target/release/libkompo_fs.a "${ARCHIVE_NAME}/lib/"
          cp target/release/libkompo_wrap.a "${ARCHIVE_NAME}/lib/"
          echo "${{ steps.version.outputs.version }}" > "${ARCHIVE_NAME}/lib/KOMPO_VFS_VERSION"
          tar czf "${ARCHIVE_NAME}.tar.gz" "${ARCHIVE_NAME}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kompo-vfs-${{ matrix.os }}-${{ matrix.arch }}
          path: "*.tar.gz"

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: "*.tar.gz"
